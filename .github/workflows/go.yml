# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go
# yeh kab trigger hona chahiye
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# trigger hone ke baad kya kya karna chahiye
jobs:
  test-and-build:
    # we run on ubuntu ke latest servers
    runs-on: ubuntu-latest
    # boots up a docker container having postgres 15
    services: 
      postgres: 
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: controlplane_test
        ports:
          - 5432:5432
        # checks if the db is already started before running tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # kya kya karna chahiye
    steps:
    # checks out our github repo & copies to ubuntu servers
    - uses: actions/checkout@v4
    # sets up stable version of go in the server
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
    # runs go tests within the dockerized env
    - name: Run Go Tests
      env: 
        TEST_DB_DSN: postgres://testuser:testpassword@localhost:5432/controlplane_test?sslmode=disable
      run: go test -v ./...
    # building the application
    - name: Build Application
      run: go build -v ./...
    # strict code reviewer
    -name: Run golangci-lint
    uses: golangci/golangci-lint-action@v6
    with:
      version: v1.60
