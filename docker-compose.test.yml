services:
  db-test:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_DB=controlplane_test
    ports:
      - "5433:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d controlplane_test"]
      interval: 5s
      timeout: 5s
      retries: 5
